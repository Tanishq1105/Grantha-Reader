services:
  web:
    build: .
    ports: ["8000:8000"]
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:?Set SUPABASE_DB_URL in .env first}
      PORT: 8000
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_API_MODE: ${GEMINI_API_MODE:-generate_content}
      GEMINI_RESPONSE_MODE: ${GEMINI_RESPONSE_MODE:-stream}
      GEMINI_RESPONSE_TIMEOUT_SECONDS: ${GEMINI_RESPONSE_TIMEOUT_SECONDS:-180}
      GEMINI_SECOND_PASS: ${GEMINI_SECOND_PASS:-false}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-4096}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-180}
      GEMINI_CONTEXT_CHARACTERS: ${GEMINI_CONTEXT_CHARACTERS:-3600}
      GEMINI_REQUEST_BUDGET_SECONDS: ${GEMINI_REQUEST_BUDGET_SECONDS:-360}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-0}
      RAG_ENABLED: ${RAG_ENABLED:-true}
      RAG_CPU_THREADS: ${RAG_CPU_THREADS:-2}
      AI_REQUESTS_PER_MINUTE: ${AI_REQUESTS_PER_MINUTE:-12}
      EMBEDDINGS_ENABLED: ${EMBEDDINGS_ENABLED:-false}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    volumes:
      - grantha_session:/app/instance
volumes:
  grantha_session:
